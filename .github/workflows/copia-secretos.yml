# TEMPORAL: copia de seguridad de los secretos de GitHub Actions.
# Mete todos los secretos en un archivo .7z cifrado (AES-256, también los nombres de los archivos)
# con la contraseña del secreto COPIA_CLAVE, y lo deja 1 día para descargar.
# Sin COPIA_CLAVE (12 caracteres o más) no hace nada. Nada se escribe en el registro.
# Cuando tengas la copia: borra esta ejecución en Actions y este archivo.
name: Copia de los secretos (temporal)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copia:
    runs-on: ubuntu-latest
    steps:
      - name: Preparar la copia cifrada
        env:
          COPIA_CLAVE: ${{ secrets.COPIA_CLAVE }}
          TUSSAM_SECRETS_JS: ${{ secrets.TUSSAM_SECRETS_JS }}
          NAP_API_KEY: ${{ secrets.NAP_API_KEY }}
          BUSSEV_KEYSTORE_BASE64: ${{ secrets.BUSSEV_KEYSTORE_BASE64 }}
          BUSSEV_KEYSTORE_PASSWORD: ${{ secrets.BUSSEV_KEYSTORE_PASSWORD }}
          BUSSEV_KEY_ALIAS: ${{ secrets.BUSSEV_KEY_ALIAS }}
          BUSSEV_KEY_PASSWORD: ${{ secrets.BUSSEV_KEY_PASSWORD }}
          ACTUALIZAR_TOKEN: ${{ secrets.ACTUALIZAR_TOKEN }}
          TUSSAM_LINEAS_ITEM: ${{ secrets.TUSSAM_LINEAS_ITEM }}
        run: |
          set -euo pipefail
          if [ "${#COPIA_CLAVE}" -lt 12 ]; then
            echo "::error::Crea antes el secreto COPIA_CLAVE con una contraseña de 12 caracteres o más."
            exit 1
          fi
          D="$RUNNER_TEMP/secretos-bussev"
          mkdir -p "$D"
          umask 077
          guardados=""
          for n in TUSSAM_SECRETS_JS NAP_API_KEY BUSSEV_KEYSTORE_BASE64 BUSSEV_KEYSTORE_PASSWORD BUSSEV_KEY_ALIAS BUSSEV_KEY_PASSWORD ACTUALIZAR_TOKEN TUSSAM_LINEAS_ITEM; do
            v="${!n:-}"
            if [ -n "$v" ]; then printf '%s' "$v" > "$D/$n.txt"; guardados="$guardados $n"; fi
          done
          if [ -n "${BUSSEV_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$BUSSEV_KEYSTORE_BASE64" | base64 -d > "$D/bussev.keystore"
          fi
          {
            echo "COPIA DE LOS SECRETOS DE BUSSEV ($(date -u +%Y-%m-%d))"
            echo
            echo "Cada archivo .txt es un secreto de GitHub (Settings > Secrets and variables > Actions)."
            echo "Para volver a ponerlo: New repository secret, el nombre del archivo sin .txt y su contenido."
            echo
            echo "bussev.keystore es la clave de firma de la app (lo mismo que BUSSEV_KEYSTORE_BASE64)."
            echo "Sin ella, las versiones nuevas no se pueden instalar encima de la que tienes."
            echo "Guarda esta copia fuera de GitHub y no la compartas."
          } > "$D/LEEME.txt"
          cd "$RUNNER_TEMP"
          7z a -t7z -mhe=on -p"$COPIA_CLAVE" secretos-bussev.7z secretos-bussev > /dev/null
          rm -rf "$D"
          echo "Copia cifrada preparada con:$guardados"

      - name: Dejar la copia para descargar (1 día)
        uses: actions/upload-artifact@v4
        with:
          name: secretos-bussev-cifrados
          path: ${{ runner.temp }}/secretos-bussev.7z
          retention-days: 1
          if-no-files-found: error
